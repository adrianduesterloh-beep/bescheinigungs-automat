<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teilnahmebescheinigungen</title>
<style>
:root{
  --grund:#f7f7f5; --karte:#ffffff; --rand:#e3e2dd; --randStark:#cfcec8;
  --text:#1f1e1b; --leise:#6b6a63; --akzent:#2f6f4e; --akzentText:#ffffff;
  --warn:#8a5a00; --warnGrund:#fdf6e3; --fehler:#a13a2a; --fehlerGrund:#fbeeeb;
  --gut:#2f6f4e; --gutGrund:#eef5f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grund:#191917; --karte:#232320; --rand:#35342f; --randStark:#4a4942;
    --text:#eceae4; --leise:#a3a199; --akzent:#6fbf90; --akzentText:#12261b;
    --warn:#e0b45c; --warnGrund:#2e2718; --fehler:#e8897a; --fehlerGrund:#2e1d1a;
    --gut:#6fbf90; --gutGrund:#1b2b21;
  }
}
:root[data-theme="dark"]{
  --grund:#191917; --karte:#232320; --rand:#35342f; --randStark:#4a4942;
  --text:#eceae4; --leise:#a3a199; --akzent:#6fbf90; --akzentText:#12261b;
  --warn:#e0b45c; --warnGrund:#2e2718; --fehler:#e8897a; --fehlerGrund:#2e1d1a;
  --gut:#6fbf90; --gutGrund:#1b2b21;
}
*{box-sizing:border-box}
body{margin:0;background:var(--grund);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.huelle{max-width:860px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.12rem;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:.95rem;margin:0 0 6px}
p{margin:0 0 12px}
a{color:var(--akzent)}
ol,ul{margin:0 0 12px;padding-left:22px}
li{margin:0 0 5px}
.leise{color:var(--leise);font-size:.9rem}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:12px;
  padding:18px;margin:0 0 14px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 0 18px;flex-wrap:wrap}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
nav button{background:none;border:1px solid transparent;color:var(--leise);
  padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.92rem}
nav button:hover{background:var(--grund)}
nav button[aria-current="true"]{background:var(--karte);border-color:var(--rand);color:var(--text);font-weight:600}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 5px}
label .zusatz{font-weight:400;color:var(--leise)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--randStark);
  border-radius:8px;background:var(--karte);color:var(--text);font:inherit;font-size:.95rem}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--akzent);outline-offset:1px;border-color:var(--akzent)}
.knopf{display:inline-flex;align-items:center;gap:7px;background:var(--akzent);
  color:var(--akzentText);border:0;border-radius:8px;padding:10px 16px;
  font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none}
.knopf:disabled{opacity:.5;cursor:default}
.knopf.leiser{background:transparent;color:var(--text);border:1px solid var(--randStark)}
.knopf.gefahr{background:transparent;color:var(--fehler);border:1px solid var(--fehler)}
.knopf.link{background:none;border:0;color:var(--leise);padding:10px 4px;font-weight:400;text-decoration:underline}
.reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:620px){.zwei{grid-template-columns:1fr}}
.schritte{list-style:none;padding:0;margin:0}
.schritte li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
  border-bottom:1px solid var(--rand)}
.schritte li:last-child{border-bottom:0}
.haken{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:.85rem;font-weight:700;background:var(--grund);color:var(--leise);
  border:1px solid var(--randStark)}
.haken.fertig{background:var(--gutGrund);color:var(--gut);border-color:var(--gut)}
.marke{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;
  border-radius:999px;letter-spacing:.02em}
.m-gut{background:var(--gutGrund);color:var(--gut)}
.m-warn{background:var(--warnGrund);color:var(--warn)}
.m-fehler{background:var(--fehlerGrund);color:var(--fehler)}
.m-still{background:var(--grund);color:var(--leise)}
.hinweis{border-left:3px solid var(--randStark);padding:2px 0 2px 14px;margin:12px 0;
  color:var(--leise);font-size:.9rem}
.hinweis.warn{border-color:var(--warn);color:var(--warn)}
.hinweis.fehler{border-color:var(--fehler);color:var(--fehler)}
.hinweis.gut{border-color:var(--gut);color:var(--gut)}
.liste{border:1px solid var(--rand);border-radius:10px;overflow:hidden}
.zeile{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--rand);flex-wrap:wrap}
.zeile:last-child{border-bottom:0}
.zeile .haupt{font-weight:600}
code{background:var(--grund);border:1px solid var(--rand);border-radius:5px;
  padding:1px 6px;font-size:.85em;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--leise);font-weight:600;padding:6px 8px 6px 0;
  border-bottom:1px solid var(--rand)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rand);vertical-align:top}
.mitte{max-width:400px;margin:14vh auto;padding:0 18px}
.pdfrahmen{width:100%;height:520px;border:1px solid var(--randStark);border-radius:8px;background:#fff}
.klapp{border:1px solid var(--rand);border-radius:10px;margin:0 0 12px;background:var(--karte)}
.klapp>summary{cursor:pointer;padding:14px 16px;font-weight:600;display:flex;
  gap:10px;align-items:center;justify-content:space-between;list-style:none}
.klapp>summary::-webkit-details-marker{display:none}
.klapp[open]>summary{border-bottom:1px solid var(--rand)}
.klappinhalt{padding:4px 16px 18px}
.demoband{background:var(--warnGrund);color:var(--warn);padding:9px 14px;
  border-radius:8px;font-size:.88rem;margin:0 0 16px;border:1px solid var(--warn)}
.cb{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:12px;cursor:pointer}
.cb input{width:auto;margin-top:5px}
.fuss{color:var(--leise);font-size:.8rem;text-align:center;padding:24px 0 0;border-top:1px solid var(--rand);margin-top:30px}
/* Assistent */
.fortschritt{display:flex;gap:4px;margin:0 0 18px}
.fortschritt span{flex:1;height:5px;border-radius:3px;background:var(--rand)}
.fortschritt span.erledigt{background:var(--gut)}
.fortschritt span.aktuell{background:var(--akzent);opacity:.55}
.anleitung{background:var(--grund);border:1px solid var(--rand);border-radius:10px;padding:14px 18px;margin:14px 0}
.anleitung ol{margin:6px 0 0}
.anleitung li{margin:0 0 7px}
.assistentfuss{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--rand)}
.assistentfuss>div{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font:inherit;font-size:.86em;background:var(--grund);border:1px solid var(--randStark);border-radius:5px;padding:0 6px}
</style>
</head>
<body>
<div class="huelle" id="wurzel"></div>

<script>
/* ================================================================
   Bedienoberfläche.
   Eine Datei, kein Framework. Alles läuft über /api/… gegen den Worker.
   DEMO = true schaltet auf Beispieldaten um, dann wird nichts gesendet.
   ================================================================ */
const DEMO = false;

let stand = null;
let seite = 'start';
let offenerKurs = null;
let meldung = null;
/** Anzeigename eines Kurses: ZPP-Titel, sonst Ablefy-Produkt, sonst „Neuer Kurs“. */
const kursName = (k) => k.titel || k.produktName || 'Neuer Kurs';
let aSchritt = 0;          // aktueller Schritt im Assistenten
let probeVorschau = {};    // letzte Probelauf-Vorschau je Kurs, bleibt beim Neuzeichnen stehen

const $ = (s, w = document) => w.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const zeitDe = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit' });
};
const herKurz = (iso) => {
  if (!iso) return 'noch nie';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return `vor ${min} Min.`;
  if (min < 48 * 60) return `vor ${Math.round(min / 60)} Std.`;
  return `vor ${Math.round(min / 1440)} Tagen`;
};

/* ---------------- Verbindung zum Worker ---------------- */

async function api(pfad, daten) {
  if (DEMO) return demoApi(pfad, daten);
  const opt = daten
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(daten) }
    : {};
  const res = await fetch('/api/' + pfad, opt);
  const antwort = await res.json().catch(() => ({ fehler: 'Unerwartete Antwort vom Server.' }));
  if (res.status === 401 && pfad !== 'login') { stand = null; zeichne(); throw new Error('abgemeldet'); }
  if (!res.ok) throw new Error(antwort.fehler || 'Es hat nicht geklappt.');
  return antwort;
}

async function ladeStand() {
  stand = await api('uebersicht');
  const e = stand.einstellungen || {};
  aSchritt = Number(e.assistentSchritt || 0);
}

/** Nach Anmeldung oder Neuladen: unfertige Einrichtung öffnet den Assistenten. */
function startseite() {
  seite = stand && !stand.einstellungen?.assistentFertig ? 'assistent' : 'start';
}

async function mitLaden(knopf, fn) {
  const alt = knopf ? knopf.textContent : null;
  if (knopf) { knopf.disabled = true; knopf.textContent = 'Einen Moment …'; }
  try { await fn(); }
  catch (e) { if (e.message !== 'abgemeldet') meldung = { text: e.message, art: 'fehler' }; }
  finally { if (knopf) { knopf.disabled = false; knopf.textContent = alt; } zeichne(); }
}

/* ---------------- Anmeldung ---------------- */

function zeichneLogin() {
  return `<div class="mitte">
    <h1>Teilnahmebescheinigungen</h1>
    <p class="leise">Passwort aus der Installation — oder das später unter „Einstellungen“ gesetzte.</p>
    <div class="karte">
      ${meldungHtml()}
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <div class="reihe"><button class="knopf" data-tu="login">Anmelden</button></div>
    </div>
    <p class="leise">Passwort vergessen: Im Cloudflare-Konto den Eintrag <code>auth:passwort</code> im KV-Speicher löschen, dann gilt wieder das Passwort aus der Installation. Genau beschrieben in <code>TECHNIK.md</code>.</p>
  </div>`;
}

/* ================================================================
   Assistent — geführte Einrichtung
   ================================================================ */

const SCHRITTE = [
  { id: 'willkommen', titel: 'Willkommen' },
  { id: 'mail',       titel: 'Mailversand' },
  { id: 'absender',   titel: 'Absender' },
  { id: 'ablefy',     titel: 'Ablefy verbinden' },
  { id: 'kurs',       titel: 'Kurs und Abschlussquiz' },
  { id: 'zpp',        titel: 'Angaben aus dem ZPP-Bescheid' },
  { id: 'text',       titel: 'Die Mail an die Teilnehmer' },
  { id: 'probelauf',  titel: 'Probelauf' },
  { id: 'freigabe',   titel: 'Freigabe' },
  { id: 'fertig',     titel: 'Fertig' },
];

/** Der Kurs, der im Assistenten gerade eingerichtet wird. */
function aKurs() {
  const id = stand.einstellungen?.assistentKurs;
  return stand.kurse.find((k) => k.id === id) || null;
}

/** Ist ein Schritt nach Datenlage erledigt? */
function schrittErledigt(id) {
  const m = stand.mail, k = aKurs();
  switch (id) {
    case 'willkommen': return true;
    case 'mail': return stand.schritte.mail;
    case 'absender': return m.anbieter === 'hostinger' || Boolean(m.absenderMail);
    case 'ablefy': return stand.konten.length > 0;
    case 'kurs': return Boolean(k && k.produktId && k.quizze && k.quizze.length);
    case 'zpp': return Boolean(k && k.titel && k.zppKursId && k.praeventionsprinzip && k.anbieterName && k.anbieterAdresse && k.ort && (k.hatUnterschrift || k.unterschriftName));
    case 'text': return Boolean(k && k.betreff && (m.anbieter === 'hostinger' || k.absender?.absenderMail));
    case 'probelauf': return Boolean(k && k.letzterProbelauf);
    case 'freigabe': return Boolean(k && k.aktiv);
    case 'fertig': return true;
  }
  return false;
}

async function merkeSchritt(n, kursId) {
  aSchritt = n;
  const daten = { schritt: n };
  if (kursId !== undefined) daten.kursId = kursId;
  await api('einstellungen/assistent', daten);
}

function zeichneAssistent() {
  aSchritt = Math.max(0, Math.min(aSchritt, SCHRITTE.length - 1));
  const s = SCHRITTE[aSchritt];
  const balken = SCHRITTE.slice(1, -1).map((x, i) => {
    const n = i + 1;
    return `<span class="${n < aSchritt || (n === aSchritt && schrittErledigt(x.id)) ? 'erledigt' : n === aSchritt ? 'aktuell' : ''}" title="${esc(x.titel)}"></span>`;
  }).join('');
  const inhalt = ASSISTENT[s.id]();
  const erledigt = schrittErledigt(s.id);

  const fuss = s.id === 'willkommen' ? `<div class="assistentfuss"><div></div><div>
      <button class="knopf" data-a="weiter">Einrichtung starten</button></div></div>`
    : s.id === 'fertig' ? ''
    : `<div class="assistentfuss">
      <div><button class="knopf leiser" data-a="zurueck">Zurück</button>
        <button class="knopf link" data-a="pause">Später weitermachen</button></div>
      <div>${erledigt ? '<span class="marke m-gut">erledigt</span> ' : ''}${inhalt.pruefen
        ? `<button class="knopf${erledigt && inhalt.weiterZusaetzlich ? ' leiser' : ''}" data-a="pruefen">${esc(erledigt ? (inhalt.knopfErledigt || 'Speichern und weiter') : (inhalt.knopf || 'Speichern und weiter'))}</button>`
        : '<button class="knopf" data-a="weiter">Weiter</button>'}${erledigt && inhalt.weiterZusaetzlich ? ' <button class="knopf" data-a="weiter">Weiter</button>' : ''}</div>
    </div>`;

  return `<div class="kopf">
      <div><h1>Einrichtung</h1><span class="leise">${aSchritt === 0 ? 'Schritt für Schritt bis zur ersten Bescheinigung' : `Schritt ${aSchritt} von ${SCHRITTE.length - 2}: ${esc(s.titel)}`}</span></div>
      <button class="knopf leiser" data-tu="logout">Abmelden</button>
    </div>
    ${DEMO ? '<div class="demoband">Vorführung mit Beispieldaten. Nichts hiervon wird gespeichert oder verschickt.</div>' : ''}
    <div class="fortschritt">${balken}</div>
    ${meldungHtml()}
    <div class="karte">
      <h2>${esc(s.titel)}</h2>
      ${inhalt.html}
      ${fuss}
    </div>
    ${fussHtml()}`;
}

/* Jeder Schritt: html, optional knopf-Beschriftung, und pruefen() — speichert
   das Formular und liefert true, wenn es weitergehen darf. */
const ASSISTENT = {
  willkommen: () => ({ html: `
    <p>Besteht ein Teilnehmer das Abschlussquiz deines Kurses, füllt dieses Programm die Teilnahmebescheinigung für die Krankenkasse aus und schickt sie ihm per Mail — automatisch, ohne dass du etwas tust.</p>
    <p>Die Einrichtung hat acht Schritte und dauert etwa eine Stunde. Zwei Schritte haben Wartezeit, die nicht an dir liegt: die Freischaltung deiner Absenderdomain (Minuten bis Stunden) und ein Testkauf im eigenen Kurs.</p>
    <div class="anleitung"><strong>Das brauchst du</strong>
      <ol>
        <li>Deinen Login bei <strong>myablefy.com</strong></li>
        <li>Zugang zur <strong>DNS-Verwaltung deiner Domain</strong> — beim Anbieter, bei dem du die Domain gekauft hast</li>
        <li>Aus dem <strong>ZPP-Anbieterportal</strong>, vom eingetragenen <em>Kurs</em> (nicht vom Konzept): Titel der Maßnahme, Kurs-ID, Präventionsprinzip, Anbietername, Anschrift</li>
        <li>Eine <strong>Unterschrift</strong> als PNG mit durchsichtigem Hintergrund — oder den Namen der Person, die unterschreiben darf</li>
      </ol></div>
    <p class="leise">Du kannst jederzeit unterbrechen. Beim nächsten Anmelden geht es an derselben Stelle weiter.</p>` }),

  mail: () => {
    const m = stand.mail;
    return { knopf: 'Speichern und Testmail schicken', knopfErledigt: 'Weiter', html: `
    <p>Die Bescheinigungen werden über einen Mail-Versanddienst verschickt. Empfohlen ist <strong>Resend</strong> — kostenlos bis 3.000 Mails im Monat. Du brauchst dort ein Konto, eine freigeschaltete Absenderdomain und einen API-Schlüssel.</p>
    <details class="klapp" ${m.hatToken ? '' : 'open'}><summary>Resend einrichten und Schlüssel holen — Klick für Klick</summary>
    <div class="klappinhalt">
      <ol>
        <li>Auf <strong>resend.com</strong> ein Konto anlegen und die Bestätigungsmail anklicken.</li>
        <li>Links <strong>Domains</strong> → <strong>Add Domain</strong>. Deine Absenderdomain eintragen, zum Beispiel <code>deine-firma.de</code>. Region <em>Europe</em>.</li>
        <li>Resend zeigt drei DNS-Einträge (MX, SPF, DKIM). Jeden davon bei deinem Domainanbieter unter „DNS“ oder „DNS-Einträge“ anlegen — Typ, Name und Wert genau übernehmen. Hängt der Anbieter deine Domain an den Namen automatisch an, nur den vorderen Teil eintragen (<code>send</code> statt <code>send.deine-firma.de</code>).</li>
        <li>Bei Resend auf <strong>Verify</strong>. Stehen alle drei Einträge auf grün, ist die Domain freigeschaltet. Das dauert Minuten, manchmal Stunden — solange „Später weitermachen“.</li>
        <li>Links <strong>API Keys</strong> → <strong>Create API Key</strong>, Permission <em>Sending access</em>. Den Schlüssel sofort kopieren: Resend zeigt ihn nur dieses eine Mal.</li>
      </ol>
      <p class="leise">Ausführlich, mit Sonderfällen: <code>MAILVERSAND-EINRICHTEN.md</code> im Paket.</p>
    </div></details>

    <label for="anbieter">Versanddienst</label>
    <select id="anbieter">
      <option value="resend" ${m.anbieter !== 'hostinger' ? 'selected' : ''}>Resend (empfohlen)</option>
      <option value="hostinger" ${m.anbieter === 'hostinger' ? 'selected' : ''}>Hostinger Postfach</option>
    </select>
    <label for="token">API-Schlüssel <span class="zusatz">${m.hatToken ? 'gespeichert — nur ausfüllen, um ihn zu ersetzen' : 'beginnt mit re_'}</span></label>
    <input id="token" type="password" autocomplete="off" placeholder="${m.hatToken ? '••••••••••••' : 're_…'}">
    <div id="hostingerfeld" style="display:${m.anbieter === 'hostinger' ? 'block' : 'none'}">
      <label for="mailboxid">Postfach-Kennung bei Hostinger</label>
      <input id="mailboxid" value="${esc(m.mailboxId)}" placeholder="aus GET /api/v1/me">
    </div>
    <label for="warnan">Deine E-Mail-Adresse <span class="zusatz">empfängt die Testmail und später jede Störungsmeldung</span></label>
    <input id="warnan" type="email" value="${esc(m.warnAn)}" placeholder="du@deine-firma.de">
    ${m.absenderMail ? '' : `<label for="absmail">Absenderadresse <span class="zusatz">auf der Domain, die du bei Resend freigeschaltet hast</span></label>
    <input id="absmail" type="email" placeholder="bescheinigung@deine-firma.de">`}
    ${m.geprueft ? `<div class="hinweis gut">Testmail erfolgreich verschickt am ${zeitDe(m.geprueft)}.</div>`
      : '<div class="hinweis">„Speichern und Testmail schicken“ speichert die Angaben und schickt sofort eine Testmail an deine Adresse. Kommt sie nicht an: Spamordner prüfen, dann bei Resend, ob die Domain auf grün steht.</div>'}`,
    pruefen: async () => {
      const daten = {
        anbieter: $('#anbieter').value, token: $('#token').value || undefined,
        mailboxId: $('#mailboxid') ? $('#mailboxid').value : '', warnAn: $('#warnan').value,
      };
      if ($('#absmail')) daten.absenderMail = $('#absmail').value;
      const neuTesten = !stand.schritte.mail || Boolean(daten.token) || daten.anbieter !== stand.mail.anbieter;
      await api('mail/speichern', daten);
      if (neuTesten) {
        const r = await api('mail/test', { an: $('#warnan').value });
        meldung = { text: 'Testmail an ' + r.an + ' verschickt.', art: 'ok' };
      }
      await ladeStand();
      return stand.schritte.mail;
    } };
  },

  absender: () => {
    const m = stand.mail;
    return { html: `
    <p>Von wem sollen die Bescheinigungen kommen? Im Postfach des Teilnehmers steht zuerst der <strong>Absendername</strong> — er sollte der Name sein, unter dem der Kurs verkauft wird.</p>
    <div class="zwei">
      <div><label for="absname">Absendername</label><input id="absname" value="${esc(m.absenderName)}" placeholder="Praxis Sonnenweg"></div>
      <div><label for="absmail">Absenderadresse <span class="zusatz">Domain muss beim Versanddienst freigeschaltet sein</span></label><input id="absmail" type="email" value="${esc(m.absenderMail)}" placeholder="bescheinigung@deine-firma.de"></div>
    </div>

/** Was als Abschlussquiz markiert ist, plus wann es zuletzt gemeldet wurde. */
function quizAuswahlHtml(k) {
  const q = k.quizze || [];
  if (!q.length) return '';
  const namen = q.map((x) => `<strong>${esc(x.name || 'Quiz ' + x.id)}</strong>`).join(', ');
  return `<div class="hinweis gut">${q.length === 1 ? 'Abschlussquiz: ' + namen : 'Abschlussquizze (alle müssen bestanden sein): ' + namen}
    <br><span class="leise">Zuletzt gemeldet: ${k.quizZuletzt ? herKurz(k.quizZuletzt) : 'noch nie'}</span></div>`;
}

/** Hinweis, wenn im Kurs ein neues Quiz mit dem Lektionsnamen des Abschlussquiz aufgetaucht ist. */
function quizWarnungHtml(k) {
  const w = k.quizWarnung;
  if (!w) return '';
  return `<div class="karte" style="border-color:var(--warn)">
    <h2>Bitte prüfen: neues Quiz in „${esc(kursName(k))}“</h2>
    <p>Seit ${herKurz(w.zeit)} wird ein Quiz gemeldet, das das Programm vorher nie gesehen hat: <strong>${esc(w.quizName)}</strong> (Kennung ${esc(w.quizId)}). Es hat denselben Lektionsnamen wie das eingestellte Abschlussquiz (Kennung ${esc(w.ersetzt)}).</p>
    <p>Das passiert, wenn ein Quiz in Ablefy gelöscht und neu angelegt wurde. Dann gilt die alte Kennung nicht mehr, und Teilnehmer bekommen keine Bescheinigung.</p>
    <div class="reihe">
      <button class="knopf" data-tu="warnungja" data-id="${k.id}">Neues Quiz als Abschlussquiz übernehmen</button>
      <button class="knopf leiser" data-tu="warnungnein" data-id="${k.id}">Ignorieren, das alte gilt weiter</button>
    </div>
  </div>`;
}

/** Absender-Abschnitt auf Kursseite und im Assistenten. */
function absenderBlock(k, m) {
  if (m.standardFuerKurse) {
    return `<div class="hinweis">Absender laut Mailversand: <strong>${esc(m.absenderName || '—')}</strong> &lt;${esc(m.absenderMail || '—')}&gt;${m.antwortAn ? ' · Antworten an ' + esc(m.antwortAn) : ''}</div>
    <label class="cb"><input type="checkbox" id="cbeigen" ${k.eigenerAbsender ? 'checked' : ''}>
      <span><strong>Abweichende Absenderangaben für diesen Kurs</strong><br><span class="leise">Wenn dieser Kurs unter dem Namen eines anderen Anbieters läuft.</span></span></label>
    <div id="eigenfelder" style="display:${k.eigenerAbsender ? 'block' : 'none'}">${absenderFelder(k)}</div>`;
  }
  return absenderFelder(k);
}
function absenderFelder(k) {
  return `<div class="zwei">
      <div>${feld('absname', 'Absendername', k.absenderName, '', 'text', 'Praxis Sonnenweg')}</div>

    </div>
    ${feld('antwortan', 'Antwortadresse', k.antwortAn, 'wohin Rückfragen der Teilnehmer gehen · leer = Absenderadresse', 'email')}`;
}

        : '<span class="marke m-fehler">Zugangsdaten fehlen</span>'}
    </div>`).join('');

  return `${kopfHtml()}
  ${meldungHtml()}
  ${stand.kurse.map(quizWarnungHtml).join('')}
  ${offenBand}
  ${einrichtung}
  <div class="karte">
    <h2>Kurse</h2>
    <div class="liste">${kursZeilen}</div>
    ${stand.konten.length ? '<div class="reihe"><button class="knopf leiser" data-gehe="konten">Kurs anlegen</button><button class="knopf link" data-tu="kursgefuehrt">Kurs geführt anlegen</button></div>' : ''}
  </div>

  ${stand.konten.length ? `<div class="karte"><h2>Ablefy-Konten</h2><div class="liste">${kontoZeilen}</div></div>` : ''}

  <div class="karte">
    <h2>Letzte Ereignisse</h2>
    ${protokollTabelle(stand.protokoll.slice(0, 8))}
    ${stand.protokoll.length > 8 ? '<div class="reihe"><button class="knopf leiser" data-gehe="protokoll">Ganzes Protokoll</button></div>' : ''}
  </div>
  ${fussHtml()}`;
}

function protokollTabelle(eintraege) {
  if (!eintraege.length) return '<p class="leise">Noch keine Ereignisse. Sobald ein Teilnehmer ein Abschlussquiz beantwortet, steht es hier.</p>';
  const marke = (e) => {
    const t = String(e.ergebnis || '');
    const art = t === 'verschickt' ? 'm-gut' : t.includes('test') || t === 'prüfen' ? 'm-warn'
      : t === 'fehler' || t === 'angehalten' || t === 'aufgegeben' ? 'm-fehler' : 'm-still';
    return `<span class="marke ${art}">${esc(t)}</span>`;
  };
  return `<div style="overflow-x:auto"><table>
    <tr><th>Wann</th><th>Kurs</th><th>Ergebnis</th><th>Details</th></tr>
    ${eintraege.map((e) => `<tr>
      <td style="white-space:nowrap">${zeitDe(e.zeit)}</td>
      <td>${esc(e.kursName || '—')}</td>
      <td>${marke(e)}</td>
      <td>${esc(e.grund || e.an || e.name || '')}</td>
    </tr>`).join('')}
  </table></div>`;
}

function feld(id, titel, wert, zusatz = '', typ = 'text', platzhalter = '') {

  ${abschnitt('1. Produkt und Abschlussquiz bei Ablefy', ablefyFertig, `

    <h3 style="margin-top:28px">Bescheinigung nachholen</h3>
    <p class="leise" style="margin-top:-2px">Für eine Bestellung, deren Bescheinigung nicht verschickt wurde — nachdem der gemeldete Grund behoben ist.</p>

  `, false, k.aktiv ? (k.testmodus ? '<span class="marke m-warn">Testmodus</span>' : '<span class="marke m-gut">freigegeben</span>') : '<span class="marke m-still">nicht freigegeben</span>')}

  <div class="reihe">
    <button class="knopf" data-tu="kursspeichern" data-id="${k.id}">Speichern</button>
    <button class="knopf gefahr" data-tu="kursweg" data-id="${k.id}">Kurs löschen</button>
  </div>${fussHtml()}`;
}

}

    <ol>
      <li>Unter „Einstellungen“ eine Sicherung herunterladen.</li>
      <li>Das Update-ZIP entpacken — darin liegen nur einzelne Dateien, keine Ordner.</li>

      <li>Unten <strong>Commit changes</strong>. Ein, zwei Minuten später läuft die neue Fassung.</li>

    <table>
      <tr><th>Name</th><th>Wozu</th><th>Ändern?</th></tr>
      <tr><td><code>ADMIN_PASSWORT</code></td><td>Anmeldung hier, solange unter „Einstellungen“ kein eigenes Passwort gesetzt ist.</td><td>Jederzeit. Danach unter <em>Overview → Versions</em> prüfen, dass der blaue Balken auf dem neuesten Eintrag steht; sonst <em>Deployments</em> → oberste Zeile → drei Punkte (…) → <em>Promote version</em>.</td></tr>
      <tr><td><code>DATEN_SCHLUESSEL</code></td><td>Verschlüsselt Ablefy-Schlüssel und Mail-Token im Speicher.</td><td><strong>Nie.</strong> Sonst sind alle gespeicherten Zugangsdaten unlesbar und müssen neu eingetragen werden.</td></tr>
    </table>
    <p class="leise">Cloudflare zeigt ein Secret nach dem Speichern nicht mehr an, nur ersetzen geht. Beide Werte deshalb im Passwortmanager aufheben. Fehlt eines, zeigt die Adresse des Programms statt der Anmeldung die Seite „Fast fertig“ mit dem Namen des fehlenden Werts.</p>
  </div>

  <div class="karte">
    <h2>Passwort vergessen</h2>
    <p>Im Cloudflare-Konto: <em>Storage &amp; Databases → KV</em> → Speicher dieses Programms öffnen → Eintrag <code>auth:passwort</code> löschen. Danach gilt wieder das Passwort aus der Installation (<code>ADMIN_PASSWORT</code>). Ist auch das unbekannt: unter <em>Workers &amp; Pages → dieses Programm → Settings → Variables and Secrets</em> das Secret <code>ADMIN_PASSWORT</code> neu setzen.</p>
  </div>

  <div class="karte">
    <h2>Was das Programm nicht tut</h2>
    <ul>
      <li>Es prüft nicht, ob die ZPP-Zertifizierung des Kurses noch gültig ist.</li>
      <li>Es prüft nicht, ob der Teilnehmer alle Einheiten vor dem Abschlussquiz durchgearbeitet hat — das steuert Ablefy (Drip-In, „Quiz muss bestanden werden, um fortzufahren“).</li>
      <li>Es verwaltet keine Prämien, Erstattungen oder SEPA-Dateien.</li>
      <li>Es liest keine Zusatzfelder aus dem Checkout; der Name auf der Bescheinigung ist der Käufername der Bestellung.</li>
      <li>Es rät nie: Fehlt eine Angabe, wird nichts verschickt, und du bekommst eine Meldung.</li>
    </ul>
  </div>${fussHtml()}`;
}

function kopfHtml() {
  const e = stand.einstellungen || {};
  return `<div class="kopf">
      <h1>Teilnahmebescheinigungen</h1>
      <button class="knopf leiser" data-tu="logout">Abmelden</button>
    </div>
    ${DEMO ? '<div class="demoband">Vorführung mit Beispieldaten. Nichts hiervon wird gespeichert oder verschickt.</div>' : ''}
    <nav>
      ${e.assistentFertig ? '' : `<button data-gehe="assistent" aria-current="${seite === 'assistent'}">Einrichtung</button>`}
      <button data-gehe="start" aria-current="${seite === 'start'}">Übersicht</button>
      <button data-gehe="mail" aria-current="${seite === 'mail'}">Mailversand</button>
      <button data-gehe="konten" aria-current="${seite === 'konten' || seite === 'kurs'}">Ablefy &amp; Kurse</button>
      <button data-gehe="protokoll" aria-current="${seite === 'protokoll'}">Protokoll</button>
      <button data-gehe="einstellungen" aria-current="${seite === 'einstellungen'}">Einstellungen</button>
      <button data-gehe="hilfe" aria-current="${seite === 'hilfe'}">Hilfe</button>
    </nav>`;
}

function fussHtml() {
  return `<div class="fuss">Bescheinigungs-Automat · Version ${esc(stand.version || '')}</div>`;
}

function meldungHtml() {
  if (!meldung) return '';
  const art = meldung.art === 'fehler' ? 'fehler' : meldung.art === 'warn' ? 'warn' : 'gut';
  const h = `<div class="hinweis ${art}">${esc(meldung.text)}</div>`;
  meldung = null;
  return h;
}

function zeichne() {
  const w = $('#wurzel');
  if (!stand) { w.innerHTML = zeichneLogin(); return; }
  if (seite === 'assistent') w.innerHTML = zeichneAssistent();
  else if (seite === 'start') w.innerHTML = zeichneStart();
  else if (seite === 'mail') w.innerHTML = zeichneMail();
  else if (seite === 'konten') w.innerHTML = zeichneKonten();
  else if (seite === 'kurs') w.innerHTML = zeichneKurs();
  else if (seite === 'einstellungen') w.innerHTML = zeichneEinstellungen();
  else if (seite === 'hilfe') w.innerHTML = zeichneHilfe();
  else if (seite === 'protokoll') w.innerHTML = kopfHtml() + '<div class="karte"><h2>Protokoll</h2>'
    + protokollTabelle(stand.protokoll) + '</div>' + fussHtml();
  if (seite === 'kurs') nachKursZeichnen(stand.kurse.find((x) => x.id === offenerKurs));
  if (seite === 'assistent' && SCHRITTE[aSchritt].id === 'kurs' && aKurs()) nachKursZeichnen(aKurs());
  window.scrollTo({ top: 0 });
}

/* Produkte und gesehene Quizze nachladen, sobald eine Kursseite steht. */
async function nachKursZeichnen(k) {
  if (!k) return;
  try {
    const { produkte } = await api('konto/produkte?kontoId=' + encodeURIComponent(k.kontoId));
    const sel = $('#produkt');
    if (sel) {
      sel.innerHTML = '<option value="">— bitte wählen —</option>' + produkte.map((p) =>
        `<option value="${esc(p.id)}" ${String(p.id) === String(k.produktId) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    }
  } catch (e) {
    const sel = $('#produkt');
    if (sel) sel.innerHTML = `<option value="">Produkte nicht abrufbar: ${esc(e.message)}</option>`;
  }
  ladeGesehenListe(k);
}

async function ladeGesehenListe(k) {
  const ziel = $('#gesehen');
  if (!ziel) return;
  const produktId = $('#produkt') && $('#produkt').value ? $('#produkt').value : k.produktId;
  try {
    const { gesehen } = await api('konto/gesehen?kontoId=' + encodeURIComponent(k.kontoId) + (produktId ? '&produktId=' + encodeURIComponent(produktId) : ''));
    if (!gesehen.length) {
      ziel.innerHTML = `<div class="zeile"><span class="leise">${produktId ? 'Für dieses Produkt wurde noch kein Quiz gemeldet.' : 'Noch kein Quiz gemeldet.'} Im Teilnehmer-Zugang die letzte Einheit öffnen, das Quiz beantworten, dann hier „Liste aktualisieren“.</span></div>`;
      return;
    }
    ziel.innerHTML = gesehen.map((g) => {
      const markiert = (k.quizze || []).some((q) => String(q.id) === String(g.quizId));
      return `<div class="zeile">
      <span><span class="haupt">${esc(g.quizName || 'Quiz ' + g.quizId)}</span>
        ${g.pflicht ? '<span class="marke m-still" title="In Ablefy ist eingestellt, dass dieses Quiz bestanden werden muss, um fortzufahren">Pflicht zum Fortfahren</span>' : ''}<br>
        <span class="leise">${g.produktName ? esc(g.produktName) + ' · ' : ''}${g.zeit ? 'zuletzt beantwortet ' + herKurz(g.zeit) : 'zuerst gesehen ' + zeitDe(g.zuerst)} · Kennung ${esc(g.quizId)}</span></span>
      <button class="knopf ${markiert ? 'leiser' : ''}"
        data-tu="quizwahl" data-id="${k.id}" data-quiz="${esc(g.quizId)}" data-quizname="${esc(g.quizName || '')}"
        data-produkt="${esc(g.produktId)}" data-produktname="${esc(g.produktName || '')}" data-markiert="${markiert ? '1' : ''}">
        ${markiert ? 'Markierung entfernen' : 'Als Abschlussquiz markieren'}</button>
    </div>`;
    }).join('');
  } catch (e) {
    ziel.innerHTML = `<div class="zeile"><span class="hinweis fehler">${esc(e.message)}</span></div>`;
  }
}

/** Was gerade in den Feldern einer Kursseite steht — fehlende Felder behalten den alten Wert. */
function kursAusFeldern(k) {
  const v = (id, alt) => ($('#' + id) ? $('#' + id).value : alt);
  const cb = (id, alt) => ($('#' + id) ? $('#' + id).checked : alt);
  return {
    id: k.id,
    produktId: v('produkt', k.produktId),
    produktName: $('#produkt') && $('#produkt').selectedOptions[0] && $('#produkt').value
      ? $('#produkt').selectedOptions[0].textContent : k.produktName,
    quizze: k.quizze || [],
    titel: v('titel', k.titel),
    zppKursId: v('zppkursid', k.zppKursId),
    praeventionsprinzip: v('prinzip', k.praeventionsprinzip),
    anbieterName: v('anbieter', k.anbieterName),
    anbieterAdresse: v('adresse', k.anbieterAdresse),
    ort: v('ort', k.ort),
    mindestGebuehr: $('#mindest') ? Number(v('mindest', k.mindestGebuehr)) || 0 : k.mindestGebuehr,
    unterschriftName: v('signame', k.unterschriftName),
    eigenerAbsender: cb('cbeigen', k.eigenerAbsender),
    absenderName: v('absname', k.absenderName),
    absenderMail: v('absmail', k.absenderMail),
    antwortAn: v('antwortan', k.antwortAn),
    betreff: v('betreff', k.betreff),
    mailText: v('mailtext', k.mailText),
    testEmpfaenger: v('testempf', k.testEmpfaenger),
    aktiv: cb('cbaktiv', k.aktiv),
    testmodus: cb('cbtest', k.testmodus),
  };
}

async function zeigeProbelauf(kursId, orderToken, ziel) {
  const r = await api('kurs/probelauf', { id: kursId, orderToken });
  if (!r.ok) { meldung = { text: (r.grund || r.ergebnis), art: 'warn' }; return false; }
  probeVorschau[kursId] = `<div class="hinweis gut">Bescheinigung für <strong>${esc(r.name)}</strong>, Gebühr ${esc(String(r.gebuehr).replace('.', ','))} €. Sie wäre an ${esc(r.an)} gegangen.</div>
    <iframe class="pdfrahmen" src="data:application/pdf;base64,${r.pdf}"></iframe>
    <h3 style="margin-top:18px">Die Mail dazu</h3>
    <div class="karte" style="background:var(--grund)">
    <div class="leise">Von: ${esc(r.absender?.absenderName || '')} &lt;${esc(r.absender?.absenderMail || '—')}&gt;${r.absender?.antwortAn ? ' · Antworten an ' + esc(r.absender.antwortAn) : ''}</div>
    <strong>${esc(r.mailBetreff)}</strong>
    <div style="white-space:pre-wrap;margin-top:8px">${esc(r.mailText)}</div></div>`;
  if (ziel) ziel.innerHTML = probeVorschau[kursId];
  meldung = null;
  return true;
}

/* ---------------- Klicks ---------------- */

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-tu],[data-gehe],[data-kurs],[data-a]');
  if (!el) return;

  // Seitenwechsel holt immer den aktuellen Stand — Webhooks laufen im Hintergrund weiter.
  if (el.dataset.gehe) { seite = el.dataset.gehe; try { await ladeStand(); } catch {} zeichne(); return; }
  if (el.dataset.kurs) { offenerKurs = el.dataset.kurs; seite = 'kurs'; try { await ladeStand(); } catch {} zeichne(); return; }

  /* Assistent */
  if (el.dataset.a) {
    const a = el.dataset.a;
    if (a === 'zurueck') return mitLaden(el, async () => { await merkeSchritt(Math.max(0, aSchritt - 1)); });
    if (a === 'weiter') return mitLaden(el, async () => { await merkeSchritt(Math.min(SCHRITTE.length - 1, aSchritt + 1)); });
    if (a === 'pause') { seite = 'start'; return zeichne(); }
    if (a === 'abschliessen') {
      return mitLaden(el, async () => {
        await api('einstellungen/assistent', { fertig: true, kursId: '' });
        await ladeStand(); seite = 'start';
      });
    }
    if (a === 'pruefen') {
      const s = ASSISTENT[SCHRITTE[aSchritt].id]();
      return mitLaden(el, async () => {
        const weiter = s.pruefen ? await s.pruefen() : true;
        if (weiter) await merkeSchritt(Math.min(SCHRITTE.length - 1, aSchritt + 1));
      });
    }
    return;
  }

  const tu = el.dataset.tu;
  const id = el.dataset.id;

  if (tu === 'login') {
    return mitLaden(el, async () => {
      await api('login', { passwort: $('#pw').value });
      await ladeStand();
      startseite();
    });
  }
  if (tu === 'logout') { await api('logout'); stand = null; return zeichne(); }

  if (tu === 'wiederholen') {
    return mitLaden(el, async () => {
      const r = await api('wiederholen');
      await ladeStand();
      meldung = { text: r.anzahl ? 'Erneut versucht. Was noch offen ist, steht weiter oben.' : 'Es wartet nichts mehr.', art: 'ok' };
    });
  }

  if (tu === 'mailspeichern') {
    return mitLaden(el, async () => {
      await api('mail/speichern', {
        anbieter: $('#anbieter').value,
        token: $('#token').value || undefined,
        mailboxId: $('#mailboxid') ? $('#mailboxid').value : '',
        warnAn: $('#warnan').value,
        absenderName: $('#absname').value,
        absenderMail: $('#absmail').value,
        antwortAn: $('#antwortan').value,
        standardFuerKurse: $('#cbstandard').checked,
      });
      await ladeStand();
      meldung = { text: stand.mail.geprueft ? 'Gespeichert.' : 'Gespeichert. Jetzt bitte eine Testmail schicken.', art: 'ok' };
    });
  }
  if (tu === 'mailtest') {
    return mitLaden(el, async () => {
      const r = await api('mail/test', { an: $('#warnan').value });
      await ladeStand();
      meldung = { text: 'Testmail ist an ' + r.an + ' unterwegs. Wenn sie nicht ankommt, auch in den Spam schauen.', art: 'ok' };
    });
  }

  if (tu === 'kontoanlegen') {
    return mitLaden(el, async () => {
      const r = await api('konto/anlegen', {
        name: $('#kname').value, schluessel: $('#kkey').value, secret: $('#ksec').value,
      });
      await ladeStand();
      meldung = r.webhookFehler
        ? { text: 'Konto verbunden, aber die Rückmeldung bei Ablefy ließ sich nicht einrichten: ' + r.webhookFehler, art: 'warn' }
        : { text: `Verbunden: ${r.produkte.length} Produkte gefunden, Rückmeldung bei Ablefy eingerichtet.`, art: 'ok' };
    });
  }
  if (tu === 'kontoname') {
    return mitLaden(el, async () => {
      await api('konto/umbenennen', { kontoId: id, name: $('#kname-' + id).value });
      await ladeStand(); meldung = { text: 'Umbenannt.', art: 'ok' };
    });
  }
  if (tu === 'kontoschluessel') {
    return mitLaden(el, async () => {
      const r = await api('konto/schluessel', { kontoId: id, schluessel: $('#kkey-' + id).value, secret: $('#ksec-' + id).value });
      await ladeStand(); meldung = { text: `Schlüssel ersetzt und geprüft — ${r.produkte} Produkte gefunden.`, art: 'ok' };
    });
  }
  if (tu === 'webhookneu') {
    return mitLaden(el, async () => { await api('konto/webhook-neu', { kontoId: id });
      await ladeStand(); meldung = { text: 'Rückmeldung bei Ablefy neu eingetragen.', art: 'ok' }; });
  }
  if (tu === 'kontopruefen') {
    return mitLaden(el, async () => {
      const r = await api('konto/pruefen', { kontoId: id });
      meldung = r.webhookVorhanden
        ? { text: 'Die Rückmeldung ist bei Ablefy eingetragen.', art: 'ok' }
        : { text: 'Bei Ablefy ist diese Rückmeldung nicht mehr eingetragen. Bitte „Neu eintragen“ klicken.', art: 'warn' };
    });
  }
  if (tu === 'kontoweg') {
    if (!confirm('Dieses Ablefy-Konto entfernen?\n\nDas Programm löscht dabei auch die Rückmeldung (Webhook), die es bei Ablefy angelegt hat. Bescheinigungen, die aus diesem Konto schon verschickt wurden, bleiben im Protokoll.')) return;
    return mitLaden(el, async () => {
      const r = await api('konto/loeschen', { kontoId: id });
      await ladeStand();
      meldung = !r.hatteWebhook || r.webhookEntfernt
        ? { text: `Konto „${r.name}“ entfernt.`, art: 'ok' }
        : { text: `Konto „${r.name}“ hier entfernt — aber Ablefy hat das Löschen der Rückmeldung nicht bestätigt. Bitte in Ablefy nachsehen: Einstellungen → Integrationen → Webhooks → den Eintrag „Teilnahmebescheinigung (${r.name})“ löschen. Sonst schickt Ablefy weiter Meldungen ins Leere.`, art: 'warn' };
    });
  }

  if (tu === 'kursneu') {
    return mitLaden(el, async () => {
      const r = await api('kurs/anlegen', { kontoId: id });
      await ladeStand(); offenerKurs = r.kurs.id; seite = 'kurs';
    });
  }
  if (tu === 'kursgefuehrt') {
    return mitLaden(el, async () => {
      const n = SCHRITTE.findIndex((s) => s.id === 'kurs');
      await api('einstellungen/assistent', { fertig: false, schritt: n, kursId: '' });
      await ladeStand(); seite = 'assistent';
    });
  }
  if (tu === 'assistentneu') {
    return mitLaden(el, async () => {
      await api('einstellungen/assistent', { fertig: false, schritt: 0, kursId: '' });
      await ladeStand(); seite = 'assistent';
    });
  }
  if (tu === 'produkteladen' || tu === 'gesehenladen') {
    // Bewusst ohne Neuzeichnen — sonst ginge die Produktauswahl verloren.
    const k = stand.kurse.find((x) => x.id === id);
    el.disabled = true;
    try { tu === 'produkteladen' ? await nachKursZeichnen(k) : await ladeGesehenListe(k); }
    finally { el.disabled = false; }
    return;
  }
  if (tu === 'quizwahl') {
    const k = stand.kurse.find((x) => x.id === id);
    const name = el.dataset.quizname || 'Quiz ' + el.dataset.quiz;
    const entfernen = el.dataset.markiert === '1';
    if (!entfernen && !confirm(`„${name}“ als Abschlussquiz markieren?\n\nGehört dieses Quiz zur letzten Einheit des Kurses? Die Bescheinigung wird verschickt, sobald ein Teilnehmer es besteht.`)) return;
    const quizze = entfernen
      ? (k.quizze || []).filter((q) => String(q.id) !== String(el.dataset.quiz))
      : [...(k.quizze || []), { id: el.dataset.quiz, name: el.dataset.quizname || '' }];
    return mitLaden(el, async () => {
      const r = await api('kurs/speichern', { kurs: { ...kursAusFeldern(k), quizze,
        produktId: $('#produkt') && $('#produkt').value ? $('#produkt').value : (k.produktId || el.dataset.produkt),
        produktName: $('#produkt') && $('#produkt').value ? $('#produkt').selectedOptions[0].textContent : (k.produktName || el.dataset.produktname) } });
      await ladeStand();
      meldung = entfernen
        ? { text: 'Markierung entfernt.', art: 'ok' }
        : { text: `Als Abschlussquiz markiert: ${name}.` + (r.kurs.quizze.length > 1 ? ` Der Kurs hat jetzt ${r.kurs.quizze.length} Abschlussquizze — die Bescheinigung geht erst raus, wenn alle bestanden sind.` : ''), art: 'ok' };
    });
  }
  if (tu === 'warnungja' || tu === 'warnungnein') {
    return mitLaden(el, async () => {
      await api('kurs/warnung', { id, uebernehmen: tu === 'warnungja' });
      await ladeStand();
      meldung = { text: tu === 'warnungja' ? 'Übernommen. Das neue Quiz löst ab jetzt die Bescheinigung aus.' : 'Hinweis ausgeblendet. Das bisherige Abschlussquiz gilt weiter.', art: 'ok' };
    });
  }
  if (tu === 'kursspeichern') {
    const k = stand.kurse.find((x) => x.id === id);
    return mitLaden(el, async () => {
      await api('kurs/speichern', { kurs: kursAusFeldern(k) });
      await ladeStand();
      meldung = { text: 'Gespeichert.', art: 'ok' };
    });
  }
  if (tu === 'kursweg') {
    if (!confirm('Kurs wirklich löschen?')) return;
    return mitLaden(el, async () => { await api('kurs/loeschen', { id }); await ladeStand(); seite = 'start'; });
  }
  if (tu === 'sigweg') {
    return mitLaden(el, async () => { await api('kurs/unterschrift', { id, entfernen: true }); await ladeStand(); });
  }

  if (tu === 'probelauf') {
    const ziel = $('#probeergebnis');
    return mitLaden(el, async () => {
      await zeigeProbelauf(id, $('#probeorder').value, ziel);
      const alt = meldung; await ladeStand(); meldung = alt;
    });
  }
  if (tu === 'nachholen') {
    return mitLaden(el, async () => {
      const r = await api('kurs/nachholen', { id, orderToken: $('#nachorder').value, erneut: $('#cberneut').checked });
      await ladeStand();
      meldung = { text: r.ok ? 'Verschickt an ' + r.an : 'Nicht verschickt: ' + (r.grund || r.ergebnis),
        art: r.ok ? 'ok' : 'warn' };
    });
  }

  if (tu === 'passwort') {
    return mitLaden(el, async () => {
      if ($('#pwneu').value !== $('#pwneu2').value) throw new Error('Die beiden neuen Passwörter sind nicht gleich.');
      await api('einstellungen/passwort', { altes: $('#pwalt').value, neues: $('#pwneu').value });
      await ladeStand();
      meldung = { text: 'Passwort geändert.', art: 'ok' };
    });
  }
  if (tu === 'sicherungdemo') { meldung = { text: 'In der Vorführung wird nichts heruntergeladen.', art: 'warn' }; return zeichne(); }
  if (tu === 'sicherungimport') {
    const datei = $('#sicherungdatei').files[0];
    if (!datei) { meldung = { text: 'Bitte zuerst eine Sicherungsdatei auswählen.', art: 'warn' }; return zeichne(); }
    if (!confirm('Alles, was gerade eingetragen ist, wird durch die Sicherung ersetzt. Weiter?')) return;
    return mitLaden(el, async () => {
      const text = await datei.text();
      let sicherung;
      try { sicherung = JSON.parse(text); } catch { throw new Error('Die Datei lässt sich nicht lesen. Ist es die richtige .json?'); }
      const r = await api('sicherung/import', { sicherung });
      await ladeStand();
      const fehlt = [];
      if (r.ohneZugang?.length) fehlt.push('Ablefy-Schlüssel für ' + r.ohneZugang.join(', '));
      if (r.mailTokenFehlt) fehlt.push('der Schlüssel des Versanddienstes');
      meldung = { text: `Eingespielt: ${r.konten} Konten, ${r.kurse} Kurse, ${r.sperren} Versandsperren.` + (fehlt.length ? ' Jetzt neu eintragen: ' + fehlt.join(' und ') + '.' : ''), art: fehlt.length ? 'warn' : 'ok' };
    });
  }
});

/* Änderungen an Auswahlfeldern und Dateien */
document.addEventListener('change', async (ev) => {
  if (ev.target.id === 'anbieter') {
    const hf = $('#hostingerfeld');
    if (hf) hf.style.display = ev.target.value === 'hostinger' ? 'block' : 'none';
    return;
  }
  if (ev.target.id === 'cbeigen') {
    const f = $('#eigenfelder');
    if (f) f.style.display = ev.target.checked ? 'block' : 'none';
    return;
  }
  if (ev.target.id !== 'sigdatei' || !ev.target.files[0]) return;
  const kursId = seite === 'assistent' ? aKurs()?.id : offenerKurs;
  const leser = new FileReader();
  leser.onload = async () => {
    try {
      await api('kurs/unterschrift', { id: kursId, datenUrl: leser.result });
      await ladeStand();
      meldung = { text: 'Unterschrift gespeichert.', art: 'ok' };
    } catch (e) { meldung = { text: e.message, art: 'fehler' }; }
    zeichne();
  };
  leser.readAsDataURL(ev.target.files[0]);
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'pw') document.querySelector('[data-tu="login"]').click();
});

/* ---------------- Start ---------------- */
(async () => {
  try { await ladeStand(); startseite(); } catch { stand = null; }
  zeichne();
})();
</script>
</body>
</html>
